// flutter_lmdb2 ships the prebuilt liblmdb.so of dart_lmdb2. The app loads
// it through FFI, so this library carries no code of its own.

group 'com.grammatek.flutter_lmdb2'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace = 'com.grammatek.flutter_lmdb2'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
    }

    sourceSets {
        main {
            // Filled by `dart run flutter_lmdb2:fetch_native`.
            jniLibs.srcDirs = ['../lib/src/native/android']
        }
    }
}
